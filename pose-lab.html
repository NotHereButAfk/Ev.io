<!doctype html>
<html><head><meta charset="utf-8"><title>pose lab</title>
<style>html,body{margin:0;background:#20242c}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildLowPolyCharacter } from '/src/player/LowPolyModels.js';
import { rigCharacterLimbs } from '/src/player/PreviewCharacter.js';
import { buildWeaponModel } from '/src/weapons/WeaponModels.js';
import { getWeapon } from '/src/weapons/weaponDefs.js';
import { applyRifleCarry } from '/src/player/RifleCarry.js';

const Q = new URLSearchParams(location.search);
const n = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
const AIM   = n('aim', 0);
const WALK  = n('walk', 0);      // walk-cycle phase (0 = stand)
const ANG   = n('ang', -1);      // single camera angle override (radians)
const MODEL = Q.get('model') || 'vanguard';

const W = 1200, H = 560, NV = ANG >= 0 ? 1 : 3;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242c);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 6, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x99bbff, 0.9); rim.position.set(-4, 3, -5); scene.add(rim);

const body = buildLowPolyCharacter(MODEL);
scene.add(body);
const rig = rigCharacterLimbs(body);

const { group: wm } = buildWeaponModel(getWeapon('m4'), { procedural: true });
body.add(wm);

// dt = 1 ⇒ the ease factor saturates, so this lands exactly on the pose.
applyRifleCarry(rig, wm, AIM, 1, {
  sway: WALK ? Math.sin(WALK) * 0.05 : 0,
  bob:  WALK ? Math.abs(Math.sin(WALK)) * 0.022 : 0,
});

if (WALK) {
  const sw = Math.sin(WALK) * 0.55;
  rig.legL.rotation.x = sw; rig.legR.rotation.x = -sw;
  rig.kneeL.rotation.x = -1.0 * Math.max(0,  Math.cos(WALK));
  rig.kneeR.rotation.x = -1.0 * Math.max(0, -Math.cos(WALK));
}

body.updateWorldMatrix(true, true);
const handW = {};
body.traverse((o) => { if (/^hand_[LR]$/.test(o.name)) handW[o.name] = o.getWorldPosition(new THREE.Vector3()); });
const gripW = new THREE.Vector3(0, -0.12,  0.10).applyQuaternion(wm.quaternion).add(wm.position);
const hgW   = new THREE.Vector3(0, -0.02, -0.28).applyQuaternion(wm.quaternion).add(wm.position);
window.__probe = {
  gripErr: handW.hand_R ? +handW.hand_R.distanceTo(gripW).toFixed(4) : null,
  hgErr:   handW.hand_L ? +handW.hand_L.distanceTo(hgW).toFixed(4)   : null,
};
if (Q.has('dbg')) {
  const dot = (p, c) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8),
    new THREE.MeshBasicMaterial({ color: c, depthTest: false })); m.renderOrder = 99;
    m.position.copy(p); body.add(m); };
  dot(gripW, 0x00ff66); dot(hgW, 0x00aaff);
}

const cam = new THREE.PerspectiveCamera(28, (W / NV) / H, 0.1, 100);
const target = new THREE.Vector3(0, 1.05, 0);
const angles = ANG >= 0 ? [{ a: ANG, e: 0.08 }] : [
  { a: Math.PI,        e: 0.06 },   // model's FRONT (-Z)
  { a: Math.PI * 0.72, e: 0.10 },   // three-quarter
  { a: Math.PI * 0.5,  e: 0.05 },   // model's right side
];
renderer.setScissorTest(true);
angles.forEach((v, i) => {
  const r = 3.9;
  cam.position.set(
    target.x + Math.sin(v.a) * Math.cos(v.e) * r,
    target.y + Math.sin(v.e) * r + 0.15,
    target.z + Math.cos(v.a) * Math.cos(v.e) * r
  );
  cam.lookAt(target);
  const x = i * (W / NV);
  renderer.setViewport(x, 0, W / NV, H);
  renderer.setScissor(x, 0, W / NV, H);
  renderer.render(scene, cam);
});
window.__ready = true;
</script>
</body></html>
